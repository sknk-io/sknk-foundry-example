name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fmt-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Soldeer install
        run: forge soldeer install
      - name: Forge fmt check
        run: forge fmt --check
      - name: Forge test
        run: forge test